name: Flu · build

on:
  push:
    paths: ["numerologia/**", ".github/workflows/flu.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: numerologia

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: flu-web
          path: numerologia/build/web

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      # Firma de lanzamiento: añade los secretos del repositorio
      # ANDROID_KEYSTORE_BASE64 (el .jks en base64) y ANDROID_KEYSTORE_PASSWORD.
      # Sin ellos, la app se firma con la clave de depuración (sirve para probar, no para Play).
      - name: Configurar firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=upload\nstoreFile=upload-keystore.jks\n' \
              "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties
          else
            echo "::warning::Sin secretos de firma: se usa la clave de depuración."
          fi
      - run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: flu-android
          path: |
            numerologia/build/app/outputs/bundle/release/app-release.aab
            numerologia/build/app/outputs/flutter-apk/app-release.apk

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      # Compila sin firmar para comprobar que iOS está sano. Para la App Store hace falta
      # una cuenta de Apple Developer y firmar desde Xcode, Codemagic o fastlane.
      - run: flutter build ios --release --no-codesign
